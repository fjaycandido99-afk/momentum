workflows:
  ios-build:
    name: Voxu iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: .
    labels:
      - capacitor

    integrations:
      app_store_connect: app_store_connect

    environment:
      node: 22
      xcode: 26.2
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: com.voxu.app
        APP_STORE_APPLE_ID: "6759702163"

    cache:
      cache_paths:
        - $HOME/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true

    # The app is a shell that loads https://voxu.app, so a web change is live
    # the moment Vercel deploys it — it is not in the binary at all. Building
    # on every master push meant ten builds and ten TestFlight uploads in a
    # day for changes the shell doesn't contain.
    #
    # Automatic builds now run only when something that IS in the binary
    # changes. Manual builds from the Codemagic UI ignore this and always
    # run, so a release is never blocked by it.
    when:
      changeset:
        includes:
          - 'ios'
          - 'capacitor.config.ts'
          - 'package.json'
          - 'package-lock.json'
          - 'codemagic.yaml'

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Capacitor sync
        script: |
          npx cap sync ios
          # Register custom native plugins (not npm packages, so cap sync won't find them)
          node -e "
            const fs = require('fs');
            const f = 'ios/App/App/capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            let changed = false;
            for (const p of ['AudioAnalyzerPlugin', 'WidgetBridgePlugin']) {
              if (!c.packageClassList.includes(p)) { c.packageClassList.push(p); changed = true; }
            }
            if (changed) fs.writeFileSync(f, JSON.stringify(c, null, '\t'));
          "

      - name: Install Apple Certificate
        script: |
          CERTIFICATE_PATH=/tmp/build_certificate.p12
          KEYCHAIN_PATH=/tmp/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate from base64 env var (printf avoids echo -n issues on macOS)
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D -o $CERTIFICATE_PATH
          echo "Certificate file size: $(wc -c < $CERTIFICATE_PATH) bytes"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "=== Installed certificates ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        script: |
          PP_PATH=ios/App/Voxu_App_Store_Distribution.mobileprovision
          PP_PLIST=/tmp/pp_decoded.plist

          # Verify the committed profile file
          echo "Profile file size: $(wc -c < $PP_PATH) bytes"
          echo "File header (hex): $(xxd -l 16 $PP_PATH)"

          # Decode the CMS envelope to a plist file
          /usr/bin/security cms -D -i $PP_PATH > $PP_PLIST

          # Extract UUID from decoded plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $PP_PLIST)
          echo "Provisioning Profile UUID: $PP_UUID"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          # Extract and show profile name
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $PP_PLIST)
          echo "Profile name: $PP_NAME"

          # Verify it has push notifications
          echo "=== Entitlements ==="
          /usr/libexec/PlistBuddy -c "Print Entitlements" $PP_PLIST

      - name: Set version and build number
        script: |
          cd ios/App
          # NOTE: marketing version must be HIGHER than any approved
          # App Store version. Apple rejects re-uploads under an
          # already-approved version even with a new build number.
          # Bump this whenever you push a release to App Store; for
          # TestFlight-only re-spins you can keep it and just increment
          # the build #.
          #
          # 1.2.1 is approved and live, so uploads under it were being
          # rejected — every build since then had nowhere to land.
          agvtool new-marketing-version 1.2.2
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0) + 1))

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive

      - name: Generate ExportOptions and export IPA
        script: |
          cd ios/App

          # Read profile name from decoded plist
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /tmp/pp_decoded.plist)
          echo "Using profile: $PP_NAME"

          # Generate ExportOptions.plist dynamically
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>FX8T7ASYCL</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.voxu.app</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          echo "=== ExportOptions.plist ==="
          cat ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Cleanup Keychain
        script: security delete-keychain /tmp/app-signing.keychain-db || true

    artifacts:
      - ios/App/build/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────────────────
  android-build:
    name: Voxu Android Build
    max_build_duration: 45
    # macOS, not linux_x2 — copied from DLCWorker's working Android workflow,
    # which learned it the hard way: the Linux image defaulted to an older JDK
    # and Capacitor 8 failed with "invalid source release: 21". `java: 21` in
    # the environment is not a documented value (the docs' examples stop at
    # 17), so this does not gamble on it; the build step picks JDK 21
    # explicitly instead.
    instance_type: mac_mini_m2
    working_directory: .
    labels:
      - capacitor

    environment:
      node: 22
      # Upload the keystore ONCE in Codemagic: Teams/Personal account ->
      # Code signing identities -> Android keystores, with reference name
      # `voxu_upload`. Codemagic then sets CM_KEYSTORE_PATH,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and CM_KEY_PASSWORD itself, and
      # android/app/build.gradle reads them directly.
      #
      # This replaced a `groups: [google_play]` reference that failed the
      # build at startup — "references to unknown variable group(s)" — and
      # which also meant base64-ing a signing key through a clipboard. No
      # group is needed now, so there is nothing to misname.
      android_signing:
        - voxu_upload
      vars:
        PACKAGE_NAME: com.voxu.app

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true

    # Same reasoning as ios-build: the app is a shell that loads
    # https://voxu.app, so a web change is already live and is not in the
    # binary. Only build when something that IS in the binary changes.
    # Manual builds from the UI ignore this.
    when:
      changeset:
        includes:
          - 'android'
          - 'capacitor.config.ts'
          - 'package.json'
          - 'package-lock.json'
          - 'codemagic.yaml'

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Capacitor sync
        script: npx cap sync android

      - name: Check the keystore arrived
        script: |
          set -e
          # Codemagic places the keystore itself from the android_signing
          # reference above. If the reference is missing or misnamed there is
          # no path here, and the build would produce an unsigned AAB that
          # Play refuses with an error that never mentions signing.
          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -s "$CM_KEYSTORE_PATH" ]; then
            echo "No keystore. Upload one in Codemagic under Code signing identities ->"
            echo "Android keystores with the reference name 'voxu_upload'."
            exit 1
          fi
          echo "Keystore present ($(wc -c < "$CM_KEYSTORE_PATH") bytes), alias ${CM_KEY_ALIAS}"

      - name: Write google-services.json
        script: |
          set -e
          # Without this file the Google Services plugin is not applied and the
          # app can never obtain an FCM token — push is dead on every install.
          # build.gradle fails a release build rather than let that ship
          # silently, so this step has to succeed. Skipped only if the file is
          # committed to the repo.
          TARGET="$CM_BUILD_DIR/android/app/google-services.json"
          if [ -s "$TARGET" ]; then
            echo "google-services.json is committed in the repo — using that."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$TARGET"
            echo "Wrote google-services.json ($(wc -c < "$TARGET") bytes)"
          else
            echo "Neither a committed google-services.json nor GOOGLE_SERVICES_JSON is present."
            echo "Android push would be dead in this build. Add the variable to the google_play group,"
            echo "or build with -PallowNoPush=true if you really mean to ship without push."
            exit 1
          fi

      - name: Set version
        script: |
          set -e
          # Play refuses a versionCode it has already accepted, and the only
          # unrecoverable mistake here is going DOWN. So take the highest of
          # three numbers rather than trusting any one of them:
          #
          #   - what Play reports, plus one. Needs working Play credentials;
          #     until those exist the command errors and returns nothing, so
          #     it must never be allowed to become 0.
          #   - Codemagic's own build counter, which only ever increases.
          #   - the floor committed in build.gradle.
          #
          # This is DLCWorker's logic. Its comment records why: falling back
          # to 0 gave versionCode 1 and Play answered "already used".
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "0")
          LATEST=${LATEST:-0}
          NEXT=$((LATEST + 1))
          PBN=${PROJECT_BUILD_NUMBER:-0}
          [ "$PBN" -gt "$NEXT" ] && NEXT=$PBN
          FLOOR=$(grep -oE 'voxuVersionCode.*: *[0-9]+' android/app/build.gradle | grep -oE '[0-9]+' | head -1)
          FLOOR=${FLOOR:-1}
          [ "$FLOOR" -gt "$NEXT" ] && NEXT=$FLOOR
          echo "versionCode -> $NEXT (play=$LATEST, ci=$PBN, floor=$FLOOR)"
          echo "VOXU_VERSION_CODE=$NEXT" >> $CM_ENV

      - name: Build AAB
        script: |
          set -e
          cd android
          # Capacitor 8 needs JDK 21+ to compile, and the image's default is
          # older. Pick the first available 21+ explicitly and force Gradle
          # onto it — straight from DLCWorker's workflow, where not doing
          # this produced "invalid source release: 21".
          echo "Available JDKs:"; /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home -v 22 2>/dev/null || /usr/libexec/java_home -v 23 2>/dev/null || /usr/libexec/java_home)
          echo "Using JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          # A fresh checkout does not always carry the executable bit.
          chmod +x gradlew
          # An AAB, not an APK: Play has required the App Bundle format for
          # new apps since August 2021. An APK too, because it is the only
          # artifact you can sideload onto a phone to check the thing works
          # before Play has ever seen it. Signing comes from the CM_KEYSTORE_*
          # variables Codemagic set — build.gradle reads them, so there is
          # nothing to pass here.
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PvoxuVersionCode="$VOXU_VERSION_CODE" \
            -PvoxuVersionName="1.2.2"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt

    # Publishing is left OFF until the Play Console app record exists and the
    # first AAB has been uploaded by hand — Play will not accept an API upload
    # to an app that has never had a manual release. Turn this on afterwards:
    #
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
