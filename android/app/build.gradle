apply plugin: 'com.android.application'

/**
 * Release signing, without a key in the repository.
 *
 * Three sources, checked in this order:
 *   1. android/key.properties — for building on this machine. Gitignored.
 *   2. VOXU_KEYSTORE_* environment variables — a manual/other-CI escape hatch.
 *   3. CM_KEYSTORE_* — what Codemagic sets on its own when the workflow
 *      declares `environment.android_signing`. Nothing to wire: no base64,
 *      no variable group, no step that writes a key to disk.
 *
 * If neither is present, `release` is left UNSIGNED rather than falling back
 * to the debug key. A debug-signed AAB is refused by Play, and finding that
 * out in the upload form is worse than a build that says so.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// CM_* are the names Codemagic sets itself when the workflow references an
// uploaded keystore via `environment.android_signing`. Reading them directly
// means CI needs no glue step and no variable group — the group reference was
// failing the build before a single step ran.
def resolvedStoreFile = keystoreProperties['storeFile'] ?: System.getenv('VOXU_KEYSTORE_PATH') ?: System.getenv('CM_KEYSTORE_PATH')
def resolvedStorePassword = keystoreProperties['storePassword'] ?: System.getenv('VOXU_KEYSTORE_PASSWORD') ?: System.getenv('CM_KEYSTORE_PASSWORD')
def resolvedKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('VOXU_KEY_ALIAS') ?: System.getenv('CM_KEY_ALIAS')
def resolvedKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('VOXU_KEY_PASSWORD') ?: System.getenv('CM_KEY_PASSWORD')
def canSignRelease = resolvedStoreFile != null && file(resolvedStoreFile).exists()

android {
    namespace = "com.voxu.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.voxu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play refuses a versionCode it has already seen, so CI overrides
        // this with ORG_GRADLE_PROJECT_voxuVersionCode on every upload. The
        // literal below is only the floor for a local build.
        versionCode project.hasProperty('voxuVersionCode') ? project.voxuVersionCode.toInteger() : 1
        // The version people read. Kept in step with the iOS marketing
        // version so one product does not have two version numbers.
        versionName project.hasProperty('voxuVersionName') ? project.voxuVersionName : "1.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                // Deliberately unsigned, and loud about it. Left on the debug
                // key instead, the AAB builds fine and Play rejects it at
                // upload with a message that does not mention signing.
                logger.warn('VOXU: no keystore found (android/key.properties or VOXU_KEYSTORE_PATH) — release will be UNSIGNED and Play will refuse it.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/**
 * Firebase Cloud Messaging — the only way a push reaches an Android device.
 *
 * This block used to swallow a missing google-services.json into
 * `logger.info`, which nobody reads: a release AAB built clean, uploaded
 * clean, installed clean, and then never received a single notification. For
 * an app whose whole loop is a daily nudge, that is the worst possible
 * failure — silent, and only discoverable by a user who wonders why the app
 * went quiet.
 *
 * A debug build still just warns, so `npx cap run android` works without
 * Firebase. A RELEASE build fails, because shipping an Android build with
 * dead push is worse than not shipping one. Override deliberately with
 * `-PallowNoPush=true` if you genuinely want to ship the quiet version.
 *
 * The file itself cannot live in this repo's history usefully — download it
 * from Firebase Console (Project settings → Your apps → Android app
 * com.voxu.app) to android/app/google-services.json, or let CI write it from
 * the GOOGLE_SERVICES_JSON variable. It is not a secret: it ships inside the
 * APK, and its API key is restricted to this package name.
 */
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    def message = 'google-services.json is missing — Android push notifications will NOT work.'
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            && !project.hasProperty('allowNoPush')) {
        throw new GradleException(
            message + '\n' +
            'Download it from Firebase Console (Project settings -> Your apps -> com.voxu.app) ' +
            'to android/app/google-services.json, or pass -PallowNoPush=true to ship without push.'
        )
    }
    logger.warn('VOXU: ' + message)
}
